# Archivo para desarrollo local con hot-reload
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: clientes-api-autenticado:dev
    container_name: clientes-api-autenticado-dev

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    ports:
      - "8000:8000"

    environment:
      DB_HOST: db
      DB_NAME: clientes_autenticado_db
      DB_USER: profesor
      DB_PASSWORD: 4688
      DB_PORT: 3306

    volumes:
      - ./app:/app/app  # Hot reload en desarrollo

    depends_on:
      - db

    networks:
      - internal

  db:
    image: mariadb:10.6
    container_name: clientes-api-autenticado-db-dev

    ports:
      - "3307:3306"  # Exponer puerto para debugging

    environment:
      MYSQL_ROOT_PASSWORD: root4688
      MYSQL_DATABASE: clientes_autenticado_db
      MYSQL_USER: profesor
      MYSQL_PASSWORD: 4688

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - db_data_dev:/var/lib/mysql
      - ./docs/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

    networks:
      - internal

volumes:
  db_data_dev:

networks:
  internal:
