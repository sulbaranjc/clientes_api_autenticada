name: Deploy clientes_api_autenticado

on:
  workflow_dispatch:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: 🐳 Construir imagen Docker
        run: |
          docker build -t clientes-api-autenticado:latest .

      - name: 📦 Empaquetar imagen
        run: |
          docker save clientes-api-autenticado:latest | gzip > clientes-api-autenticado.tar.gz

      - name: 🚚 Copiar archivos al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "clientes-api-autenticado.tar.gz,docker-compose.yml,docs/init_db.sql"
          target: /tmp/clientes-api-deploy

      - name: 🚀 Desplegar en servidor Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            # Crear directorio si no existe
            mkdir -p /home/sulbaranjc/apps/clientes_api_autenticada/docs
            
            # Copiar archivos desde temporal
            cp /tmp/clientes-api-deploy/docker-compose.yml /home/sulbaranjc/apps/clientes_api_autenticada/
            cp /tmp/clientes-api-deploy/docs/init_db.sql /home/sulbaranjc/apps/clientes_api_autenticada/docs/
            
            # Cargar imagen Docker
            docker load < /tmp/clientes-api-deploy/clientes-api-autenticado.tar.gz
            
            # Desplegar
            cd /home/sulbaranjc/apps/clientes_api_autenticada
            docker compose down
            docker compose up -d
            
            # Limpiar archivos temporales
            rm -rf /tmp/clientes-api-deploy
            
            echo "✅ Despliegue completado correctamente"
